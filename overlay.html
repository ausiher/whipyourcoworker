<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; }
  html, body {
    overflow: hidden;
    background: transparent;
    width: 100%;
    height: 100%;
    cursor: default;
    user-select: none;
  }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>

// ══════════════════════════════════════════════════════════════════════════════
//  OPTIMIZED PHYSICS & PERFORMANCE SETTINGS
// ══════════════════════════════════════════════════════════════════════════════
const P = {
  segments:        24,     // number of chain links (24 for silky smooth 60fps)
  segmentLength:   24,     // base length of each link (px)
  taper:           0.55,   // tip segment is fraction of base length

  gravity:         1.1,    // normal gravity
  dropGravity:     1.4,    // fast gravity when right-click dropping
  damping:         0.94,   // velocity retention per frame
  constraintIters: 6,      // 6 iters is mathematically optimal for Verlet rope stiffness
  maxStretchRatio: 1.25,

  baseTargetAngle: -1.15,  // default "up-right" angle
  handleAimByMouseX: 0.35,
  handleAimByMouseY: 0.18,
  handleAimClamp:    1.8,
  handleSpring:      0.65,
  handleAngularDamping: 0.08,
  basePoseSegments: 2,
  basePoseStiffStart: 0.85,
  basePoseStiffEnd:   0.75,

  handleMaxBendDeg: 18,
  tipMaxBendDeg:   135,
  bendRigidityStart: 0.75,
  bendRigidityEnd:   0.10,

  wallBounce:      0.4,
  wallFriction:    0.85,

  lineWidthHandle: 7,
  lineWidthTip:    4,
  outlineWidth:   3,
  handleExtraWidth: 4,
  handleThickSegments: 2,
  bgAlpha:        0.004,  // minimal capture alpha to prevent screen pause/dimming

  arcWidth:       240,
  arcHeight:      170,
};

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

let mouseX = W / 2, mouseY = H / 2;
let prevMouseX = mouseX, prevMouseY = mouseY;
let whip = null;
let dropping = false;
let whipSpawnTime = 0;
let handleAngle = P.baseTargetAngle;
let handleAngVel = 0;
let isRunning = false;
let animFrameId = null;

// Strike state
let strike = null;
let particles = [];
let shockwaves = [];
let targetHighlights = [];

const WHIP_CRACK_SOUNDS = ['sounds/A.mp3', 'sounds/B.mp3', 'sounds/C.mp3', 'sounds/D.mp3', 'sounds/E.mp3'];

// Preload audio elements
const audioPool = WHIP_CRACK_SOUNDS.map(src => {
  const a = new Audio(src);
  a.volume = 0.9;
  return a;
});

function playCrackSound() {
  try {
    const a = audioPool[Math.floor(Math.random() * audioPool.length)];
    a.currentTime = 0;
    a.play().catch(() => {});
  } catch {}
}

document.addEventListener('mousemove', e => {
  mouseX = e.clientX;
  mouseY = e.clientY;
});

// ── Right-Click to Turn Off / Left-Click to Whip Button ─────────────────────
window.addEventListener('contextmenu', e => {
  e.preventDefault();
  // Right click only: Turn OFF (drop whip)
  if (whip && !dropping) {
    dropping = true;
  }
});

window.addEventListener('mousedown', async e => {
  if (e.button === 2) {
    // Right click only: Turn OFF (drop whip)
    e.preventDefault();
    if (whip && !dropping) {
      dropping = true;
    }
    return;
  }

  if (e.button === 0) {
    // Left click: WHIP INTO NEAREST BUTTON!
    e.preventDefault();
    if (!whip || dropping) return;
    await triggerWhipIntoButton(e.clientX, e.clientY);
  }
});

// ── Whip creation ───────────────────────────────────────────────────────────
function spawnWhip(mx, my) {
  dropping = false;
  strike = null;
  whipSpawnTime = performance.now();
  const pts = [];
  for (let i = 0; i < P.segments; i++) {
    const t = i / (P.segments - 1);
    const x = mx + t * P.arcWidth;
    const y = my - Math.sin(t * Math.PI * 0.75) * P.arcHeight;
    pts.push({ x, y, px: x, py: y });
  }
  startLoop();
  return pts;
}

function segLen(i) {
  const t = i / (P.segments - 1);
  return P.segmentLength * (1 - t * (1 - P.taper));
}

const clamp = (v, lo, hi) => (v < lo ? lo : (v > hi ? hi : v));
const lerp = (a, b, t) => a + (b - a) * t;

// ── Catmull–Rom to Cubic Bézier ─────────────────────────────────────────────
function catmullPoint(pts, i) {
  const n = pts.length;
  if (n === 0) return { x: 0, y: 0 };
  if (i < 0) return n >= 2 ? { x: 2 * pts[0].x - pts[1].x, y: 2 * pts[0].y - pts[1].y } : pts[0];
  if (i >= n) return n >= 2 ? { x: 2 * pts[n - 1].x - pts[n - 2].x, y: 2 * pts[n - 1].y - pts[n - 2].y } : pts[n - 1];
  return pts[i];
}

function whipSegmentBezier(pts, i) {
  const p0 = catmullPoint(pts, i - 1);
  const p1 = pts[i];
  const p2 = pts[i + 1];
  const p3 = catmullPoint(pts, i + 2);
  return {
    cp1x: p1.x + (p2.x - p0.x) * 0.166667,
    cp1y: p1.y + (p2.y - p0.y) * 0.166667,
    cp2x: p2.x - (p3.x - p1.x) * 0.166667,
    cp2y: p2.y - (p3.y - p1.y) * 0.166667,
    x2: p2.x,
    y2: p2.y,
  };
}

const wrapPi = a => {
  while (a > Math.PI) a -= Math.PI * 2;
  while (a < -Math.PI) a += Math.PI * 2;
  return a;
};

function updateHandleAim() {
  if (dropping || strike) return;
  const mvx = mouseX - prevMouseX;
  const mvy = mouseY - prevMouseY;
  const delta = clamp(
    mvx * P.handleAimByMouseX + mvy * P.handleAimByMouseY,
    -P.handleAimClamp,
    P.handleAimClamp
  );
  const target = P.baseTargetAngle + delta;
  const err = wrapPi(target - handleAngle);
  handleAngVel += err * P.handleSpring;
  handleAngVel *= P.handleAngularDamping;
  handleAngle = wrapPi(handleAngle + handleAngVel);
}

function applyBasePose() {
  if (!whip || dropping || strike) return;
  const dx = Math.cos(handleAngle);
  const dy = Math.sin(handleAngle);
  const guided = Math.min(P.basePoseSegments, whip.length - 1);
  for (let i = 1; i <= guided; i++) {
    const t = (i - 1) / Math.max(guided - 1, 1);
    const stiff = lerp(P.basePoseStiffStart, P.basePoseStiffEnd, t);
    const prev = whip[i - 1];
    const p = whip[i];
    const targetLen = segLen(i - 1);
    p.x = lerp(p.x, prev.x + dx * targetLen, stiff);
    p.y = lerp(p.y, prev.y + dy * targetLen, stiff);
  }
}

// Optimized bend limits (called once per frame, skips unnecessary trig)
function applyBendLimits() {
  if (!whip || whip.length < 3 || strike) return;
  const len = whip.length;
  for (let i = 1; i < len - 1; i++) {
    const a = whip[i - 1], b = whip[i], c = whip[i + 1];
    const v1x = a.x - b.x, v1y = a.y - b.y;
    const v2x = c.x - b.x, v2y = c.y - b.y;
    const l1 = Math.hypot(v1x, v1y) || 0.0001;
    const l2 = Math.hypot(v2x, v2y) || 0.0001;
    const n1x = v1x / l1, n1y = v1y / l1;
    const n2x = v2x / l2, n2y = v2y / l2;

    const dot = clamp(n1x * n2x + n1y * n2y, -1, 1);
    // Fast threshold check: if dot is high, angle is small, skip
    if (dot > 0.98) continue;

    const angle = Math.acos(dot);
    const t = i / (len - 2);
    const maxBend = lerp(P.handleMaxBendDeg, P.tipMaxBendDeg, t) * (Math.PI / 180);
    const bend = Math.PI - angle;
    if (bend <= maxBend) continue;

    const cross = n1x * n2y - n1y * n2x;
    const sign = cross >= 0 ? 1 : -1;
    const targetA = Math.atan2(n1y, n1x) + sign * (Math.PI - maxBend);
    const rigidity = lerp(P.bendRigidityStart, P.bendRigidityEnd, t);

    c.x = lerp(c.x, b.x + Math.cos(targetA) * l2, rigidity);
    c.y = lerp(c.y, b.y + Math.sin(targetA) * l2, rigidity);
  }
}

function capSegmentStretch() {
  if (!whip || whip.length < 2) return;
  const len = whip.length;
  for (let i = 0; i < len - 1; i++) {
    const a = whip[i], b = whip[i + 1];
    const dx = b.x - a.x, dy = b.y - a.y;
    const dist = Math.hypot(dx, dy) || 0.0001;
    const maxLen = segLen(i) * P.maxStretchRatio;
    if (dist > maxLen) {
      const k = maxLen / dist;
      b.x = a.x + dx * k;
      b.y = a.y + dy * k;
    }
  }
}

function applyWallCollisions() {
  if (!whip || dropping) return;
  for (let i = 1; i < whip.length; i++) {
    const p = whip[i];
    let vx = p.x - p.px, vy = p.y - p.py;
    let hit = false;
    if (p.x < 0) { p.x = 0; if (vx < 0) vx = -vx * P.wallBounce; vy *= P.wallFriction; hit = true; }
    else if (p.x > W) { p.x = W; if (vx > 0) vx = -vx * P.wallBounce; vy *= P.wallFriction; hit = true; }
    if (p.y < 0) { p.y = 0; if (vy < 0) vy = -vy * P.wallBounce; vx *= P.wallFriction; hit = true; }
    else if (p.y > H) { p.y = H; if (vy > 0) vy = -vy * P.wallBounce; vx *= P.wallFriction; hit = true; }
    if (hit) { p.px = p.x - vx; p.py = p.y - vy; }
  }
}

// ── Whip Strike Logic (Left-Click to Whip Nearest Button) ───────────────────
async function triggerWhipIntoButton(clickX, clickY) {
  let target = null;

  try {
    const res = await window.bridge.findNearestButton({ x: clickX, y: clickY });
    if (res && res.found) {
      target = {
        x: res.x,
        y: res.y,
        w: res.width,
        h: res.height,
        name: res.name,
      };
    }
  } catch {}

  // Fallback target if no UI button detected nearby: whip forward toward click/aim
  if (!target) {
    const forwardDist = 260;
    target = {
      x: clickX + Math.cos(handleAngle) * forwardDist,
      y: clickY + Math.sin(handleAngle) * forwardDist,
      w: 60,
      h: 30,
      name: 'target',
    };
  }

  // Highlight the whipped button
  targetHighlights.push({
    x: target.x - target.w / 2,
    y: target.y - target.h / 2,
    w: target.w,
    h: target.h,
    alpha: 1.0,
    name: target.name,
  });

  // Initiate dynamic whip strike
  strike = {
    startTime: performance.now(),
    duration: 220, // 220ms full strike animation
    targetX: target.x,
    targetY: target.y,
    startX: whip ? whip[whip.length - 1].x : clickX,
    startY: whip ? whip[whip.length - 1].y : clickY,
    impactFired: false,
    targetObj: target,
  };
}

function spawnImpactFX(x, y) {
  // Shockwave ring
  shockwaves.push({ x, y, r: 10, maxR: 70, alpha: 1.0, color: '#ff3344' });
  shockwaves.push({ x, y, r: 5, maxR: 45, alpha: 0.9, color: '#ffea00' });

  // Spark burst
  for (let i = 0; i < 16; i++) {
    const ang = Math.random() * Math.PI * 2;
    const spd = 4 + Math.random() * 9;
    particles.push({
      x,
      y,
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd - 2,
      alpha: 1.0,
      size: 2.5 + Math.random() * 3.5,
      color: Math.random() > 0.4 ? '#ffea00' : '#ff4422',
      gravity: 0.25,
    });
  }
}

// ── Physics Step ────────────────────────────────────────────────────────────
function update() {
  if (!whip) return;

  const now = performance.now();
  const g = dropping ? P.dropGravity : P.gravity;
  updateHandleAim();

  // If in active strike animation
  if (strike) {
    const elapsed = now - strike.startTime;
    const progress = clamp(elapsed / strike.duration, 0, 1);

    // Tip follows power curve toward target
    const tip = whip[whip.length - 1];
    if (progress < 0.65) {
      // Wind-up & snap forward phase
      const p = progress / 0.65;
      const ease = p * p * (3 - 2 * p); // smoothstep
      tip.x = lerp(strike.startX, strike.targetX, ease);
      tip.y = lerp(strike.startY, strike.targetY, ease);
    } else if (!strike.impactFired) {
      // Impact moment!
      strike.impactFired = true;
      tip.x = strike.targetX;
      tip.y = strike.targetY;
      playCrackSound();
      spawnImpactFX(strike.targetX, strike.targetY);
      window.bridge.whipCrack(strike.targetObj);
    } else {
      // Recoil & recovery phase
      const p = (progress - 0.65) / 0.35;
      const recoilDist = 25 * (1 - p);
      tip.x = strike.targetX - Math.cos(handleAngle) * recoilDist;
      tip.y = strike.targetY - Math.sin(handleAngle) * recoilDist;
    }

    if (progress >= 1.0) {
      strike = null;
    }
  }

  // Verlet integration
  const start = dropping ? 0 : 1;
  const len = whip.length;
  for (let i = start; i < len; i++) {
    const p = whip[i];
    const vx = (p.x - p.px) * P.damping;
    const vy = (p.y - p.py) * P.damping;
    p.px = p.x;
    p.py = p.y;
    p.x += vx;
    p.y += vy + g;
  }

  // Pin handle to mouse
  if (!dropping) {
    whip[0].x = mouseX;
    whip[0].y = mouseY;
    whip[0].px = mouseX;
    whip[0].py = mouseY;
  }

  capSegmentStretch();
  applyWallCollisions();
  applyBasePose();

  // Distance constraints (6 iters is ultra fast and stable)
  const tipPinned = strike && strike.impactFired;
  for (let iter = 0; iter < P.constraintIters; iter++) {
    for (let i = 0; i < len - 1; i++) {
      const a = whip[i], b = whip[i + 1];
      const dx = b.x - a.x, dy = b.y - a.y;
      const dist = Math.sqrt(dx * dx + dy * dy) || 0.0001;
      const target = segLen(i);
      const diff = (dist - target) / dist * 0.5;
      const ox = dx * diff, oy = dy * diff;

      if (i === 0 && !dropping) {
        b.x -= ox * 2;
        b.y -= oy * 2;
      } else if (i === len - 2 && tipPinned) {
        a.x += ox * 2;
        a.y += oy * 2;
      } else {
        a.x += ox; a.y += oy;
        b.x -= ox; b.y -= oy;
      }
    }
    capSegmentStretch();
  }

  applyBendLimits();

  // Particles & FX updates
  for (let i = shockwaves.length - 1; i >= 0; i--) {
    const s = shockwaves[i];
    s.r += 3.8;
    s.alpha -= 0.06;
    if (s.alpha <= 0 || s.r >= s.maxR) shockwaves.splice(i, 1);
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += p.gravity;
    p.alpha -= 0.035;
    if (p.alpha <= 0) particles.splice(i, 1);
  }

  for (let i = targetHighlights.length - 1; i >= 0; i--) {
    const h = targetHighlights[i];
    h.alpha -= 0.04;
    if (h.alpha <= 0) targetHighlights.splice(i, 1);
  }

  // Dropping completion check
  if (dropping && whip.every(p => p.y > H + 60)) {
    whip = null;
    dropping = false;
    strike = null;
    stopLoop();
    window.bridge.hideOverlay();
  }

  prevMouseX = mouseX;
  prevMouseY = mouseY;
}

// ── Rendering ───────────────────────────────────────────────────────────────
function draw() {
  ctx.clearRect(0, 0, W, H);

  // Minimal background to capture clicks without freezing screen visual
  ctx.fillStyle = `rgba(0,0,0,${P.bgAlpha})`;
  ctx.fillRect(0, 0, W, H);

  // Draw target highlight boxes
  for (const h of targetHighlights) {
    ctx.save();
    ctx.strokeStyle = `rgba(255, 68, 68, ${h.alpha})`;
    ctx.lineWidth = 2.5;
    ctx.strokeRect(h.x, h.y, h.w, h.h);
    ctx.fillStyle = `rgba(255, 68, 68, ${h.alpha * 0.15})`;
    ctx.fillRect(h.x, h.y, h.w, h.h);

    // Dynamic "WHIP!" impact label
    ctx.fillStyle = `rgba(255, 230, 0, ${h.alpha})`;
    ctx.font = 'bold 13px system-ui, sans-serif';
    ctx.fillText('⚡ WHIP!', h.x, h.y - 6);
    ctx.restore();
  }

  // Draw shockwaves
  for (const s of shockwaves) {
    ctx.save();
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.strokeStyle = s.color;
    ctx.globalAlpha = Math.max(0, s.alpha);
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.restore();
  }

  // Draw spark particles
  for (const p of particles) {
    ctx.save();
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fillStyle = p.color;
    ctx.globalAlpha = Math.max(0, p.alpha);
    ctx.fill();
    ctx.restore();
  }

  if (!whip || whip.length < 2) return;

  // Single pass path construction
  ctx.save();
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  // 1. White Halo Stroke
  ctx.beginPath();
  ctx.moveTo(whip[0].x, whip[0].y);
  for (let i = 0; i < whip.length - 1; i++) {
    const { cp1x, cp1y, cp2x, cp2y, x2, y2 } = whipSegmentBezier(whip, i);
    ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, x2, y2);
  }
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = P.lineWidthTip + P.outlineWidth * 2;
  ctx.stroke();

  // 2. Black Body Stroke
  for (let i = 0; i < whip.length - 1; i++) {
    const t = i / Math.max(1, whip.length - 2);
    const extra = i < P.handleThickSegments ? P.handleExtraWidth : 0;
    ctx.lineWidth = lerp(P.lineWidthHandle, P.lineWidthTip, t) + extra;
    const { cp1x, cp1y, cp2x, cp2y, x2, y2 } = whipSegmentBezier(whip, i);
    ctx.beginPath();
    ctx.moveTo(whip[i].x, whip[i].y);
    ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, x2, y2);
    ctx.strokeStyle = '#111111';
    ctx.stroke();
  }

  ctx.restore();
}

// ── Optimized Animation Loop (Idle when hidden) ─────────────────────────────
function loop() {
  if (!isRunning) return;
  update();
  draw();
  animFrameId = requestAnimationFrame(loop);
}

function startLoop() {
  if (!isRunning) {
    isRunning = true;
    animFrameId = requestAnimationFrame(loop);
  }
}

function stopLoop() {
  isRunning = false;
  if (animFrameId) {
    cancelAnimationFrame(animFrameId);
    animFrameId = null;
  }
  ctx.clearRect(0, 0, W, H);
}

// ── IPC from main process ───────────────────────────────────────────────────
window.bridge.onSpawnWhip(() => {
  whip = spawnWhip(mouseX || W / 2, mouseY || H / 2);
  dropping = false;
  strike = null;
  prevMouseX = mouseX;
  prevMouseY = mouseY;
  handleAngle = P.baseTargetAngle;
  handleAngVel = 0;
  startLoop();
});

window.bridge.onDropWhip(() => {
  if (whip && !dropping) dropping = true;
});

</script>
</body>
</html>
